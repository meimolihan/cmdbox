<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 明暗模式防闪烁：内联脚本，置于 <head> 最前，早于样式表与首次绘制 -->
    <script>
    (function () {
      try {
        var st = localStorage.getItem('_dark_mode_theme_');
        document.documentElement.setAttribute('data-color-mode', st === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-color-mode', 'dark');
      }
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <meta name="description" content="页面未找到 - CmdBox命令大全">
    <title>404 - 页面未找到 | CmdBox 命令搜索引擎</title>
    <link rel="shortcut icon" href="img/favicon.ico">
    <link rel="stylesheet" type="text/css" href="css/index.css?v=1d378b3b795aba25">
    <style>
      html[data-color-mode="light"] body {
        background-color: #f5f7fa !important;
      }
      html:not([data-color-mode]) body,
      html[data-color-mode="dark"] body {
        background-color: #0d1117 !important;
      }
    </style>
    <!-- 明暗模式切换 —— 径向揭示动画 (View Transitions)
         旧快照静止垫底层（z=1），新主题快照在上层（z=2）以屏幕中心为圆心用径向遮罩向外扩张；
         24% 为羽化带宽，170% 末端保证覆盖最远角落；同时关闭 VT 默认的整页交叉淡化。
         @property 注册 --theme-r 为 <percentage>，是遮罩半径能够逐帧插值的前提。
         注意：不支持 @property 的浏览器上 --theme-r 无法插值，动画会静默失效（揭示瞬间完成），
         这是预期降级而非 bug。 -->
    <style>
      @property --theme-r {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
      ::view-transition-old(root) { z-index: 1; }
      ::view-transition-new(root) {
        z-index: 2;
        animation: theme-reveal 1.5s ease-out both;
        mask-image: radial-gradient(circle at 50% 50%,
          #000 var(--theme-r), transparent calc(var(--theme-r) + 24%));
        -webkit-mask-image: radial-gradient(circle at 50% 50%,
          #000 var(--theme-r), transparent calc(var(--theme-r) + 24%));
      }
      @keyframes theme-reveal {
        from { --theme-r: 0%; }
        to   { --theme-r: 170%; }
      }
      /* 减弱动效兜底：项目全局的 prefers-reduced-motion 规则只匹配 * 与 ::before/::after，
         不会命中 ::view-transition-* 伪元素；JS 侧已守卫，此处再做一层 CSS 保险。 */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-new(root) { animation: none; }
      }
    </style>
    <script src="js/dt.js?v=1d378b3b795aba25"></script>
    <script src="js/index.js?v=1d378b3b795aba25"></script>
</head>
<body>
<div id="theme-toggle" onclick="toggleTheme()" style="position:fixed;left:10px;bottom:40px;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:999;transition:all 0.35s cubic-bezier(0.4,0,0.2,1);border:none;overflow:hidden;"></div>
<script>
/* ===== 明暗模式（沿用项目既有机制：html[data-color-mode] + localStorage._dark_mode_theme_） =====
   两态状态机：深色 ⇄ 浅色，默认深色（与项目原行为一致）。
   切换时使用 View Transitions 做「径向揭示」动画。 */
var CMDBOX_THEME_KEY = '_dark_mode_theme_';

/* 读取偏好：'dark' | 'light'；缺失或非法按项目默认值（dark） */
function cmdboxThemePref() {
  try {
    var v = localStorage.getItem(CMDBOX_THEME_KEY);
    return v === 'light' ? 'light' : 'dark';
  } catch (e) {
    return 'dark';
  }
}

/* 当前生效的主题：优先取根元素属性（开屏校正后即为偏好值） */
function cmdboxThemeEffective() {
  var attr = document.documentElement.getAttribute('data-color-mode');
  return (attr === 'light' || attr === 'dark') ? attr : cmdboxThemePref();
}

/* 应用主题：同步根元素属性、持久化偏好、刷新按钮配色 */
function applyColorMode(mode) {
  var html = document.documentElement;
  var themeToggle = document.getElementById('theme-toggle');
  html.setAttribute('data-color-mode', mode);
  try { localStorage.setItem(CMDBOX_THEME_KEY, mode); } catch (e) {}
  if (themeToggle) {
    if (mode === 'light') {
      themeToggle.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
      themeToggle.style.boxShadow = '0 4px 15px rgba(102, 126, 234, 0.4)';
    } else {
      themeToggle.style.background = 'linear-gradient(135deg, #58a6ff 0%, #79c0ff 100%)';
      themeToggle.style.boxShadow = '0 4px 15px rgba(88, 166, 255, 0.4)';
    }
  }
}

function toggleTheme() {
  var next = cmdboxThemeEffective() === 'dark' ? 'light' : 'dark';
  /* 减弱动效必须在 JS 侧守卫：项目全局的 prefers-reduced-motion 规则只匹配 * / ::before / ::after，
     不会命中 ::view-transition-* 伪元素，只靠 CSS 挡不住。 */
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (!document.startViewTransition || reduce) {
    /* 回退：浏览器不支持 View Transitions 或用户要求减弱动效 —— 直接切换，无动画、无报错 */
    applyColorMode(next);
    return;
  }
  /* 带径向揭示动画切换；回调内只做同步的状态变更，不要 await 网络或异步操作 */
  document.startViewTransition(function () {
    applyColorMode(next);
  });
}

/* 开屏校正：属性与偏好一致，避免闪烁 */
applyColorMode(cmdboxThemePref());
</script>

<div class="page-404">
  <!-- ⑳ 404 页面 SVG 插图 -->
  <div class="error-illustration">
    <svg viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="terminal-404">
      <!-- 终端窗口 -->
      <rect x="20" y="30" width="200" height="140" rx="10" stroke="currentColor" stroke-width="2" fill="var(--color-card-bg, #161b22)" opacity="0.9"/>
      <!-- macOS 圆点 -->
      <circle cx="40" cy="50" r="6" fill="#ff5f57"/>
      <circle cx="60" cy="50" r="6" fill="#febc2e"/>
      <circle cx="80" cy="50" r="6" fill="#28c840"/>
      <!-- 终端内容 -->
      <text x="40" y="90" fill="currentColor" font-family="monospace" font-size="14" opacity="0.7">$ command --not-found</text>
      <text x="40" y="115" fill="#f85149" font-family="monospace" font-size="14">command not found: 404</text>
      <text x="40" y="140" fill="#8b949e" font-family="monospace" font-size="12">$ _</text>
      <!-- 闪烁光标 -->
      <rect x="40" y="128" width="8" height="16" fill="currentColor" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1s" repeatCount="indefinite"/>
      </rect>
      <!-- 装饰线条 -->
      <line x1="30" y1="70" x2="210" y2="70" stroke="currentColor" stroke-width="1" opacity="0.1"/>
    </svg>
  </div>
  <div class="error-code">404</div>
  <h1 class="error-title">页面未找到</h1>
  <p class="error-desc">抱歉，您访问的页面不存在或已被移除。试试搜索您需要的 CmdBox 命令。</p>
  <!-- ㉑ 404 搜索框 -->
  <div class="error-search">
    <input type="text" id="error-search-input" class="error-search-input" placeholder="搜索 CmdBox 命令..." autocomplete="off">
    <button id="error-search-btn" class="error-search-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      搜索
    </button>
  </div>
  <div class="error-actions">
    <a href="index.html" class="error-btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      返回首页
    </a>
    <a href="hot.html" class="error-btn btn-secondary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"></polyline>
        <line x1="12" y1="19" x2="20" y2="19"></line>
      </svg>
      命令列表
    </a>
  </div>
</div>
<script>
// 404 搜索框功能
(function() {
  var input = document.getElementById('error-search-input');
  var btn = document.getElementById('error-search-btn');
  if (!input || !btn) return;
  var basePath = ''.replace(/\/$/, '');
  function doSearch() {
    var kw = (input.value || '').trim();
    if (kw) {
      window.location.href = basePath + '/list.html#!kw=' + encodeURIComponent(kw);
    }
  }
  btn.addEventListener('click', doSearch);
  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doSearch();
  });
})();
</script>


</body>
